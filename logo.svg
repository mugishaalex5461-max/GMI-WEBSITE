<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="GMI logo — hexagon emblem with red 'GMI' text">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b" stop-opacity="1" />
      <stop offset="1" stop-color="#1f1f1f" stop-opacity="1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="none" />
  <!-- outer hexagon -->
  <g transform="translate(200,200)">
    <polygon points="0,-160 139,-80 139,80 0,160 -139,80 -139,-80" fill="none" stroke="url(#g)" stroke-width="18" stroke-linejoin="round" />
    <!-- inner hexagon -->
    <polygon points="0,-115 100,-57.5 100,57.5 0,115 -100,57.5 -100,-57.5" fill="none" stroke="#2b2b2b" stroke-width="12" stroke-linejoin="round" />
    <!-- background subtle pattern circle -->
    <circle cx="-60" cy="-60" r="4" fill="#dcdcdc" opacity="0.35" />
    <!-- GMI text -->
    <g transform="translate(-30,20)">
      <text x="0" y="0" font-family="Sora, 'Space Grotesk', Arial, sans-serif" font-size="96" font-weight="700" fill="#E53935">GMI</text>
    </g>
  </g>
</svg>
